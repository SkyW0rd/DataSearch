name: Build

# Builds all three platforms on every push/PR (core tests always run; the app
# only builds where IPlatformService has an implementation — see
# docs/TZ_DataSearch.md п.14 for which platforms are actually verified).
# Pushing a tag like "v0.1.0" additionally publishes the packaged binaries as
# a GitHub Release.
#
# Qt is installed via each platform's own package manager (Homebrew/apt)
# rather than a third-party installer action: the installer-provided Qt
# build pulled in a dependency on the AGL framework, which newer Xcode SDKs
# no longer ship, breaking the macOS link step. Homebrew's qtbase (verified
# locally — see README) doesn't have that problem. Windows has no equivalent
# system package manager for Qt, so it's the one platform still using an
# installer action.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: DataSearch-windows-x64
          - os: macos-latest
            artifact: DataSearch-macos
          - os: ubuntu-latest
            artifact: DataSearch-linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt (Windows)
        if: runner.os == 'Windows'
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.7.*'

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install qtbase sqlite3

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y qt6-base-dev libsqlite3-dev zlib1g-dev

      - name: Install dependencies (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: vcpkg install sqlite3[fts5]:x64-windows zlib:x64-windows

      - name: Configure (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: cmake -S . -B build -DCMAKE_TOOLCHAIN_FILE="$VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"

      - name: Configure (macOS/Linux)
        if: runner.os != 'Windows'
        run: cmake -S . -B build

      - name: Build
        run: cmake --build build --config Release -j

      - name: Run core tests
        run: ctest --test-dir build --output-on-failure --build-config Release

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          macdeployqt build/src/app/datasearch_app.app
          mkdir dist
          ditto -c -k --sequesterRsrc --keepParent build/src/app/datasearch_app.app "dist/${{ matrix.artifact }}.zip"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist_payload
          Copy-Item build/src/app/Release/datasearch_app.exe dist_payload/
          # vcpkg's applocal deps step (VCPKG_APPLOCAL_DEPS, on by default)
          # already dropped sqlite3.dll/z.dll etc. next to the exe at build
          # time -- windeployqt only knows about Qt's own dependencies, so
          # these have to be copied across separately or the packaged app
          # fails to launch with "sqlite3.dll not found".
          Copy-Item build/src/app/Release/*.dll dist_payload/
          & "$env:QT_ROOT_DIR/bin/windeployqt.exe" dist_payload/datasearch_app.exe
          New-Item -ItemType Directory -Path dist
          Compress-Archive -Path dist_payload/* -DestinationPath "dist/${{ matrix.artifact }}.zip"

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist_payload dist
          cp build/src/app/datasearch_app dist_payload/
          tar czf "dist/${{ matrix.artifact }}.tar.gz" -C dist_payload .

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/*

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    # GITHUB_TOKEN is read-only by default on repos created after the 2023
    # permissions change; softprops/action-gh-release needs write access to
    # create the release. Grant it just for this job, not the whole workflow.
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
